<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1821"/><stop offset="1" stop-color="#0e0d12"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb347"/><stop offset=".55" stop-color="#ff6b6b"/><stop offset="1" stop-color="#d457c8"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/><stop offset="1" stop-color="#ffffff" stop-opacity=".1"/></linearGradient>
<clipPath id="clip"><rect width="1200" height="380" rx="28"/></clipPath>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>

<linearGradient id="name" gradientUnits="userSpaceOnUse" x1="430" y1="0" x2="700" y2="0"><stop offset="0" stop-color="#ffb347"/><stop offset=".55" stop-color="#ff6b6b"/><stop offset="1" stop-color="#d457c8"/></linearGradient>
<linearGradient id="sunv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#d457c8"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity=".16"/></pattern>
<linearGradient id="fadeg" x1="0" y1="0" x2="1" y2="0"><stop offset=".35" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
<mask id="fade"><rect width="1200" height="380" fill="url(#fadeg)"/></mask>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}

.orb{animation:drift 16s ease-in-out infinite alternate}
.orb2{animation:drift 21s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-70px,36px)}}
.caret{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.15s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.22)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#clip)">
<rect width="1200" height="380" fill="url(#bg)"/>

<circle class="orb" cx="1010" cy="40" r="170" fill="#ff8a3d" fill-opacity=".34" filter="url(#blur)"/>
<circle class="orb2" cx="1130" cy="360" r="160" fill="#c850c0" fill-opacity=".32" filter="url(#blur)"/>
<circle cx="80" cy="420" r="150" fill="#ff6b6b" fill-opacity=".1" filter="url(#blur)"/>

<rect width="1200" height="380" fill="url(#dots)" mask="url(#fade)"/>
<g transform="translate(64 62)">
  <rect width="168" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
  <circle class="pulse" cx="22" cy="20" r="5" fill="#ffb347"/>
  <text class="mono" x="38" y="26" font-size="18" fill="#aaa5b5">@nerontad</text>
</g>
<text class="sans" x="62" y="204" font-size="80" font-weight="800" letter-spacing="-2" fill="#f6f3f8">Hola, soy <tspan fill="url(#name)">Diego</tspan></text>
<text class="sans" x="64" y="258" font-size="30" font-weight="600" fill="#aaa5b5">Ingeniero en Informática</text>
<text class="mono" x="64" y="312" font-size="23" fill="#ff8a5c">&gt; <tspan fill="#f6f3f8">desarrollador full stack</tspan><tspan class="caret" fill="#ffb347">▍</tspan></text>

<g transform="translate(836 54) rotate(2.5)">
  <rect width="300" height="192" rx="18" fill="#15131a" stroke="#ffffff" stroke-opacity=".12"/>
  <circle cx="24" cy="24" r="5.5" fill="#ff6b6b"/><circle cx="43" cy="24" r="5.5" fill="#ffb347"/><circle cx="62" cy="24" r="5.5" fill="#6bd48f"/>
  <path d="M0 42h300" stroke="#ffffff" stroke-opacity=".08"/>
  <rect x="22" y="58" width="70" height="9" rx="4.5" fill="#ff8a5c"/><rect x="100" y="58" width="96" height="9" rx="4.5" fill="#5d5868"/><rect x="40" y="82" width="120" height="9" rx="4.5" fill="#d457c8"/><rect x="168" y="82" width="54" height="9" rx="4.5" fill="#5d5868"/><rect x="40" y="106" width="60" height="9" rx="4.5" fill="#ffb347"/><rect x="108" y="106" width="110" height="9" rx="4.5" fill="#5d5868"/><rect x="58" y="130" width="88" height="9" rx="4.5" fill="#5d5868"/><rect x="154" y="130" width="44" height="9" rx="4.5" fill="#ff6b6b"/><rect x="40" y="154" width="36" height="9" rx="4.5" fill="#5d5868"/>
  <rect x="84" y="154" width="0" height="9" rx="4.5" fill="#ffb347"><animate attributeName="width" values="0;0;96;96;0" keyTimes="0;.1;.55;.9;1" dur="5s" repeatCount="indefinite"/></rect>
</g>
<g transform="translate(976 236) rotate(-3)">
  <rect width="176" height="92" rx="18" fill="#1d1a24" stroke="#ffffff" stroke-opacity=".14"/>
  <rect class="bar" style="animation-delay:0.00s" x="24" y="22" width="9" height="46" rx="4.5" fill="url(#sunv)"/><rect class="bar" style="animation-delay:-0.23s" x="40" y="22" width="9" height="46" rx="4.5" fill="url(#sunv)"/><rect class="bar" style="animation-delay:-0.46s" x="56" y="22" width="9" height="46" rx="4.5" fill="url(#sunv)"/><rect class="bar" style="animation-delay:-0.69s" x="72" y="22" width="9" height="46" rx="4.5" fill="url(#sunv)"/><rect class="bar" style="animation-delay:-0.92s" x="88" y="22" width="9" height="46" rx="4.5" fill="url(#sunv)"/><rect class="bar" style="animation-delay:-1.15s" x="104" y="22" width="9" height="46" rx="4.5" fill="url(#sunv)"/><rect class="bar" style="animation-delay:-1.38s" x="120" y="22" width="9" height="46" rx="4.5" fill="url(#sunv)"/>
  <g transform="translate(142 16) scale(0.8333333333333334)" fill="none" stroke="#aaa5b5" color="#aaa5b5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5.5l11-2.2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></g>
</g>
<g transform="translate(800 232) rotate(-9)">
  <rect width="76" height="76" rx="20" fill="#1d1a24" stroke="#ffffff" stroke-opacity=".14"/>
  <g transform="translate(18 18) scale(1.6666666666666667)" fill="none" stroke="#ffb347" color="#ffb347" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="5"/><path d="M7 10.4v3.2M5.4 12h3.2"/><circle cx="15.6" cy="11" r=".6" fill="currentColor"/><circle cx="18" cy="13.2" r=".6" fill="currentColor"/></g>
</g>
</g>
<rect x=".75" y=".75" width="1198.5" height="378.5" rx="27.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
